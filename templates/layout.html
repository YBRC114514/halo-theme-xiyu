<!doctype html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org" th:lang="${#locale.toLanguageTag}" th:fragment="html (head, content)" th:attr="data-color-scheme=${(theme.config.style.color_scheme ?: 'system') == 'system' ? 'auto' : (theme.config.style.color_scheme ?: 'system')}, data-radius=${theme.config.style.radius ?: 'soft'}, data-font-scale=${theme.config.style.font_scale ?: 'normal'}, data-hero=${theme.config.home.hero_height ?: 'normal'}, data-fullscreen=${theme.config.home.hero_fullscreen == true}, data-card-density=${theme.config.layout.card_density ?: 'compact'}" th:style="|--accent-user-light:${theme.config.style.accent_light ?: '#1158d1'};--accent-user-dark:${theme.config.style.accent_dark ?: '#008fec'}|">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" th:if="${not #strings.isEmpty(site.favicon)}" th:href="${site.favicon}" />
    <link rel="icon" th:unless="${not #strings.isEmpty(site.favicon)}" type="image/svg+xml" th:href="${#theme.assets('/favicon.svg')}" />
    <title th:if="${head == null}" th:text="${site.title}">熹屿 Xiyu</title>
    <th:block th:if="${head != null}"><th:block th:replace="${head}" /></th:block>
    <script>
      (function () {
        var r = document.documentElement;
        r.classList.add("js");
        var attr = r.getAttribute("data-color-scheme") || "auto";
        var saved = null;
        try {
          /* xiyu- is the canonical prefix since 1.0.16; read the legacy
             azure-isle- value once as a fallback so returning visitors do
             not see a flash before main.ts migrates and removes it. */
          saved = localStorage.getItem("xiyu-scheme") || localStorage.getItem("azure-isle-scheme");
        } catch (e) {}
        var mode = saved === "system" || saved === "light" || saved === "dark"
          ? saved
          : (attr === "auto" ? "system" : attr);
        var finalAttr = mode === "system" ? "auto" : mode;
        r.setAttribute("data-color-scheme", finalAttr);
        r.setAttribute("data-scheme-mode", mode);
        r.classList.add("color-scheme-" + finalAttr);
      })();
    </script>
    <script type="module" crossorigin src="/themes/theme-xiyu/assets/layout-BCpRHfrE.js"></script>
    <link rel="stylesheet" crossorigin href="/themes/theme-xiyu/assets/layout-c6dnmC8c.css">
  </head>
  <body th:attr="data-show-reveal=${theme.config.features.show_reveal != false}, data-code-copy=${theme.config.features.show_code_copy != false}">
    <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
      <symbol id="i-auto" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M12 7v6M9 10l3-3 3 3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.2"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4 1.5-4-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-1-2.6c3.3-.4 6.8-1.6 6.8-7.3A5.7 5.7 0 0 0 19.3 4a5.3 5.3 0 0 0-.1-4s-1.2-.4-4 1.5a13.4 13.4 0 0 0-7 0C5.4-.4 4.2 0 4.2 0a5.3 5.3 0 0 0-.1 4A5.7 5.7 0 0 0 2.6 8c0 5.7 3.5 6.9 6.8 7.3a3.4 3.4 0 0 0-1 2.6V22"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></symbol>
      <symbol id="i-rss" viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L3 10l7 3 3 7 8-17zM10 13l11-10"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-2zM4 18a2 2 0 0 1 2-2h14"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
      <symbol id="i-list-alt" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v6.2c0 4.3-3.1 7.9-7.5 9.3-4.4-1.4-7.5-5-7.5-9.3V6L12 3z"/><path d="M9 12l2.2 2.2L15.4 10"/></symbol>
      <symbol id="i-copyright" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5a3.9 3.9 0 1 0 0 5"/></symbol>
    </svg>

    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="progress-bar" th:if="${theme.config.features.show_progress != false}"><span></span></div>

    <header class="site-header">
      <div class="shell">
        <a class="brand-pill" th:href="@{/}" th:classappend="${theme.config.home.brand_hide_text} ? 'no-text' : ''" th:with="brandName = ${theme.config.home.brand_title ?: theme.config.home.hero_title ?: site.title},
            brandSvgRaw = ${theme.config.home.brand_logo_svg ?: ''},
            brandSvg = ${#strings.contains(brandSvgRaw, '&lt;svg') and not #strings.contains(brandSvgRaw, '&lt;script') and not #strings.contains(brandSvgRaw, 'javascript:') and not #strings.contains(brandSvgRaw, ' onload=') and not #strings.contains(brandSvgRaw, ' onerror=') ? brandSvgRaw : ''},
            brandImg = ${theme.config.home.brand_logo_url ?: theme.config.home.brand_logo ?: site.logo}">
          <span class="brand-svg" th:if="${not #strings.isEmpty(brandSvg)}" th:utext="${brandSvg}"></span>
          <img th:if="${#strings.isEmpty(brandSvg) and not #strings.isEmpty(brandImg)}" th:src="${brandImg}" th:alt="${brandName}" th:classappend="${#strings.contains(brandImg, '.svg')} ? 'brand-img-svg' : ''" />
          <span class="brand-mark" th:if="${#strings.isEmpty(brandSvg) and #strings.isEmpty(brandImg)}" th:text="${#strings.isEmpty(brandName) ? '青' : #strings.substring(brandName, 0, 1)}">青</span>
          <span class="brand-text" th:unless="${theme.config.home.brand_hide_text}" th:text="${brandName}">熹屿 Xiyu</span>
        </a>

        <div class="nav-panel" id="nav-panel">
          <nav class="primary-nav" aria-label="主导航" th:with="menu = ${menuFinder.getPrimary()}">
            <ul th:if="${menu != null}">
              <li th:each="item : ${menu.menuItems}">
                <a th:href="@{${item.status.href}}" th:target="${item.spec.target?.value}">
                  <span th:text="${item.status.displayName}">菜单</span>
                  <svg class="icon" th:if="${not #lists.isEmpty(item.children)}" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
                </a>
                <ul class="submenu" th:if="${not #lists.isEmpty(item.children)}">
                  <li th:each="child : ${item.children}">
                    <a th:href="@{${child.status.href}}" th:text="${child.status.displayName}" th:target="${child.spec.target?.value}"></a>
                  </li>
                </ul>
              </li>
            </ul>
          </nav>
          <span class="nav-divider" aria-hidden="true"></span>
          <div class="header-actions">
            <th:block th:if="${pluginFinder.available('PluginSearchWidget') and theme.config.features.show_search != false}">
              <button class="icon-btn nav-icon" type="button" data-search title="搜索" aria-label="搜索">
                <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
              </button>
            </th:block>
            <a class="icon-btn nav-icon" th:if="${not pluginFinder.available('PluginSearchWidget') and not #strings.isEmpty(theme.config.features.search_fallback_url)}" th:href="@{${theme.config.features.search_fallback_url}}" th:attr="data-search-fallback=${theme.config.features.search_fallback_url}" title="搜索" aria-label="搜索">
              <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            </a>
            <button class="icon-btn nav-icon" type="button" data-theme-toggle title="切换配色" aria-label="切换配色">
              <svg class="icon" aria-hidden="true"><use href="#i-auto"></use></svg>
            </button>
          </div>
        </div>

        <div class="mobile-actions">
          <th:block th:if="${pluginFinder.available('PluginSearchWidget') and theme.config.features.show_search != false}">
            <button class="icon-btn" type="button" data-search title="搜索" aria-label="搜索">
              <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            </button>
          </th:block>
          <button class="icon-btn" type="button" data-theme-toggle title="切换配色" aria-label="切换配色">
            <svg class="icon" aria-hidden="true"><use href="#i-auto"></use></svg>
          </button>
          <button class="icon-btn nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="nav-panel" title="打开菜单" aria-label="打开菜单">
            <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="nav-backdrop" data-nav-close aria-hidden="true"></div>

    <main id="main-content"><th:block th:replace="${content}" /></main>

    <footer class="site-footer" th:attr="data-start-date=${theme.config.basic.site_start_date ?: ''}">
      <div class="shell">
        <div class="footer-top">
          <div class="footer-identity">
            <div class="footer-running" th:if="${theme.config.footer.show_footer_stats != false}">
              <span class="footer-kicker">本站已运行</span>
              <div class="footer-days"><strong data-running-days>0</strong><span>天</span></div>
              <div class="footer-stats">
                <span><b data-stat-posts>0</b> 篇文章</span>
                <span><b data-stat-visits>0</b> 次阅读</span>
                <span><b data-stat-comments>0</b> 条评论</span>
              </div>
            </div>
            <div class="profile-social footer-social" th:if="${(theme.config.basic.show_github_link != false and !#strings.isEmpty(theme.config.basic.github_url)) or (theme.config.basic.show_email_link != false and !#strings.isEmpty(theme.config.basic.email))}">
              <a th:if="${theme.config.basic.show_github_link != false and !#strings.isEmpty(theme.config.basic.github_url)}" th:href="${theme.config.basic.github_url}" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg class="icon" aria-hidden="true"><use href="#i-github"></use></svg></a>
              <a th:if="${theme.config.basic.show_email_link != false and !#strings.isEmpty(theme.config.basic.email)}" th:href="|mailto:${theme.config.basic.email}|" aria-label="邮箱"><svg class="icon" aria-hidden="true"><use href="#i-mail"></use></svg></a>
            </div>
          </div>

        </div>
        <div
          class="footer-bottom"
          th:with="nowYear=${#temporals.format(#temporals.createNow(), 'yyyy')},
                   startCfg=${theme.config.footer.copyright_start ?: ''},
                   startSite=${#strings.length(theme.config.basic.site_start_date ?: '') >= 4 ? #strings.substring(theme.config.basic.site_start_date, 0, 4) : ''},
                   copyStart=${#strings.isEmpty(startCfg) ? (#strings.isEmpty(startSite) ? nowYear : startSite) : startCfg},
                   copyName=${#strings.isEmpty(theme.config.footer.copyright_name) ? (theme.config.basic.footer_note ?: site.title) : theme.config.footer.copyright_name},
                   lic=${theme.config.footer.copyright_type ?: 'reserved'},
                   copyAlign=${theme.config.footer.copyright_align ?: 'right'}"
          th:attr="data-copy-align=${copyAlign}"
          th:classappend="${theme.config.features.show_backtop != false} ? 'has-backtop' : ''"
        >
          <span class="footer-beian" th:if="${not #strings.isEmpty(theme.config.basic.beian)}">
            <svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg>
            <span th:text="${theme.config.basic.beian}">闽ICP备00000000号</span>
          </span>
          <span class="footer-copy">
            <span class="footer-copy-main">© <span th:text="${copyStart}">2025</span><th:block th:if="${copyStart != nowYear}"> — <span th:text="${nowYear}">2026</span></th:block> By <span class="footer-copy-name" th:text="${copyName}">熹屿 Xiyu</span></span>
            <th:block th:if="${lic != 'none'}">
              <span class="footer-license" th:switch="${lic}">
                <span th:case="'reserved'">保留所有权利</span>
                <a th:case="'cc-by'" th:href="'https://creativecommons.org/licenses/by/4.0/deed.zh-hans'" target="_blank" rel="license noopener noreferrer">CC BY 4.0</a>
                <a th:case="'cc-by-sa'" th:href="'https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans'" target="_blank" rel="license noopener noreferrer">CC BY-SA 4.0</a>
                <a th:case="'cc-by-nc'" th:href="'https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hans'" target="_blank" rel="license noopener noreferrer">CC BY-NC 4.0</a>
                <a th:case="'cc-by-nc-sa'" th:href="'https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans'" target="_blank" rel="license noopener noreferrer">CC BY-NC-SA 4.0</a>
                <a th:case="'cc-by-nd'" th:href="'https://creativecommons.org/licenses/by-nd/4.0/deed.zh-hans'" target="_blank" rel="license noopener noreferrer">CC BY-ND 4.0</a>
                <a th:case="'cc-by-nc-nd'" th:href="'https://creativecommons.org/licenses/by-nc-nd/4.0/deed.zh-hans'" target="_blank" rel="license noopener noreferrer">CC BY-NC-ND 4.0</a>
                <a th:case="'cc0'" th:href="'https://creativecommons.org/publicdomain/zero/1.0/deed.zh-hans'" target="_blank" rel="license noopener noreferrer">CC0 1.0</a>
                <th:block th:case="'custom'">
                  <a th:if="${not #strings.isEmpty(theme.config.footer.copyright_url)}" th:href="${theme.config.footer.copyright_url}" target="_blank" rel="noopener noreferrer" th:text="${theme.config.footer.copyright_custom ?: '自定义版权'}">自定义版权</a>
                  <span th:if="${#strings.isEmpty(theme.config.footer.copyright_url)}" th:text="${theme.config.footer.copyright_custom ?: '自定义版权'}">自定义版权</span>
                </th:block>
                <th:block th:case="*"></th:block>
              </span>
            </th:block>
            <span class="footer-powered" th:if="${theme.config.footer.show_powered != false}">
              Powered by <a href="https://halo.run" target="_blank" rel="noopener noreferrer">Halo</a> · <a href="https://github.com/YBRC114514/halo-theme-xiyu" target="_blank" rel="noopener noreferrer">XiYu</a>
            </span>
          </span>
        </div>
        <halo:footer />
        <div class="footer-data" hidden aria-hidden="true" th:if="${postFinder != null and theme.config.footer.show_footer_stats != false}">
          <span th:each="p : ${postFinder.listAll()}" th:attr="data-href=${p.status.permalink}, data-title=${p.spec.title}, data-published=${#temporals.format(p.spec.publishTime, 'yyyy-MM-dd')}, data-visit=${p.stats.visit}, data-comment=${p.stats.comment}"></span>
        </div>
      </div>
    </footer>

    <button class="back-top" type="button" data-back-top th:if="${theme.config.features.show_backtop != false}"
            th:with="backMode=${theme.config.features.backtop_mode ?: 'top'}"
            th:attr="data-backtop-mode=${backMode}, title='回到顶部', aria-label='回到顶部'">
      <svg class="icon" aria-hidden="true"><use href="#i-arrow-up"></use></svg>
    </button>
  </body>
</html>
