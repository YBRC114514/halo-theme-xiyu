<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
  <th:block th:fragment="head">
    <title th:text="${site.title}">熹屿 Xiyu</title>
    <th:block th:if="${theme.config.seo.enable_metadata != false}">
  <link rel="canonical" th:href="${site.url}" />
  <meta property="og:type" th:content="website" />
  <meta property="og:site_name" th:content="${site.title}" />
  <meta property="og:title" th:content="${site.title}" />
  <meta property="og:url" th:content="${site.url}" />
  <meta property="og:description" th:if="${site.subtitle}" th:content="${site.subtitle}" />
  <meta property="og:image" th:if="${site.logo}" th:content="${site.logo}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" th:content="${site.title}" />
  <meta name="twitter:description" th:if="${site.subtitle}" th:content="${site.subtitle}" />
  <meta name="twitter:image" th:if="${site.logo}" th:content="${site.logo}" />
</th:block>

  </th:block>

  <th:block th:fragment="content">
    <section class="hero" th:classappend="${theme.config.home.hero_fullscreen == true} ? 'is-fullscreen' : ''"
             th:with="heroBlur=${theme.config.home.hero_blur ?: '2'},
                      heroH=${theme.config.home.hero_fullscreen == true ? '' : (theme.config.home.hero_custom_height ?: '')},
                      titleIsImage=${theme.config.home.hero_title_type == 'image' and not #strings.isEmpty(theme.config.home.hero_title_image)}"
             th:style="|--hero-blur:${heroBlur}px;| + (${not #strings.isEmpty(heroH)} ? 'min-height:' + ${heroH} + ';' : '')">
      <img class="hero-bg" th:if="${not #strings.isEmpty(theme.config.home.hero_image)}" th:src="${theme.config.home.hero_image}" alt="" aria-hidden="true" />
      <span class="hero-orb one" aria-hidden="true"></span>
      <span class="hero-orb two" aria-hidden="true"></span>
      <div class="hero-inner">
        <h1 th:classappend="${titleIsImage} ? 'hero-title-image' : ''">
          <img th:if="${titleIsImage}" th:src="${theme.config.home.hero_title_image}" th:alt="${theme.config.home.hero_title ?: site.title}" />
          <th:block th:unless="${titleIsImage}" th:text="${theme.config.home.hero_title ?: site.title}">熹屿 Xiyu</th:block>
        </h1>
        <p th:if="${theme.config.home.hero_show_subtitle != false}" th:text="${theme.config.home.hero_subtitle ?: site.subtitle}">记录技术、生活与一些细碎的想法。</p>
        <div class="hero-actions" th:if="${theme.config.home.show_hero_actions == true}">
          <a class="btn btn-primary" href="#post-list">浏览文章<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></a>
          <a class="btn" th:href="@{${site.routes.archivesUri}}"><svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>文章归档</a>
        </div>
      </div>
    </section>

    <div class="shell">
      <div class="content-grid" th:classappend="${theme.config.layout.show_sidebar == false} ? 'no-sidebar' : ''" th:attr="data-sidebar=${theme.config.layout.sidebar_position ?: 'right'}">
        <div class="content-main" id="post-list"
             th:with="perPage=${theme.config.layout.posts_per_page ?: '10'},
                      listedPosts=${postFinder.list(posts.page, #conversions.convert(perPage, 'java.lang.Integer'))},
                      posts=${listedPosts}">
          <div class="section-bar">
            <h2 class="section-title">最新文章</h2>
            <span class="section-hint" th:text="|共 ${posts.total} 篇文章 · 第 ${posts.page} 页|">共 0 篇文章</span>
            <div class="view-switch" th:if="${theme.config.layout.show_view_switch != false}" data-view-switch>
              <span class="view-switch-indicator" aria-hidden="true"></span>
              <button type="button" data-view="grid" data-view-index="0" title="网格视图" aria-label="网格视图"><svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg></button>
              <button type="button" data-view="list" data-view-index="1" title="列表视图" aria-label="列表视图"><svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg></button>
            </div>
          </div>

          <div class="post-grid" data-post-grid th:classappend="${(theme.config.layout.grid_columns ?: '2') == '3'} ? 'cols-3' : ''" th:attr="data-default-view=${theme.config.layout.home_layout ?: 'grid'}">
            <article class="post-card" th:each="post : ${posts.items}" th:classappend="${post.spec.pinned} ? 'featured'" data-reveal>
  <a class="post-cover" th:href="@{${post.status.permalink}}" th:if="${theme.config.layout.show_cover != false}"
     th:classappend="${#strings.isEmpty(post.spec.cover)} ? 'is-empty' : ''"
     th:attr="aria-label=${post.spec.title}, data-glyph=${#strings.isEmpty(post.spec.cover) ? #strings.substring(post.spec.title, 0, 1) : ''}">
    <img th:if="${not #strings.isEmpty(post.spec.cover)}" th:src="${post.spec.cover}" th:alt="${post.spec.title}" loading="lazy" decoding="async" />
    <span class="cover-badge" th:if="${not #lists.isEmpty(post.categories)}" th:text="${post.categories[0].spec.displayName}">分类</span>
  </a>
  <div class="post-body">
    <h2 class="post-title"><a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">文章标题</a></h2>
    <p class="post-excerpt" th:if="${theme.config.layout.show_excerpt != false and not #strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}">文章摘要</p>
    <div class="post-meta" th:if="${theme.config.layout.show_post_meta != false}">
      <span><svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg><time th:datetime="${post.spec.publishTime}" th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}">2026-01-01</time></span>
      <span th:if="${not #lists.isEmpty(post.categories)}"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg><a th:href="@{${post.categories[0].status.permalink}}" th:text="${post.categories[0].spec.displayName}">分类</a></span>
      <span><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg><span th:text="${post.stats.visit}">0</span></span>
      <span><svg class="icon" aria-hidden="true"><use href="#i-message"></use></svg><span th:text="${post.stats.comment}">0</span></span>
    </div>
    <div class="post-tags" th:if="${not #lists.isEmpty(post.tags)}">
      <a class="chip" th:each="tag, state : ${post.tags}" th:if="${state.index < 2}" th:href="@{${tag.status.permalink}}" th:text="|# ${tag.spec.displayName}|"># 标签</a>
    </div>
  </div>
</article>

          </div>

          <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}">
            <svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>
            <p>还没有发布文章，去后台写下第一篇吧。</p>
          </div>

          <nav class="pagination" th:if="${posts.hasPrevious() || posts.hasNext()}" aria-label="分页导航">
            <a th:if="${posts.hasPrevious()}" th:href="@{${posts.page <= 2 ? '/' : '/page/' + (posts.page - 1)}}">
              <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>上一页
            </a>
            <span class="page-num" th:text="|${posts.page} / ${posts.totalPages}|">1 / 1</span>
            <a th:if="${posts.hasNext()}" th:href="@{${'/page/' + (posts.page + 1)}}">
              下一页<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </a>
          </nav>
        </div>

        <aside class="sidebar" aria-label="侧边栏" th:if="${theme.config.layout.show_sidebar != false}">
  <section class="widget profile-card" aria-label="站点名片" th:with="avatarImg = ${theme.config.basic.avatar ?: site.logo}, coverImg = ${theme.config.basic.profile_cover}">
    <div class="profile-cover">
      <img th:if="${not #strings.isEmpty(coverImg)}" th:src="${coverImg}" alt="" aria-hidden="true" />
      <span class="profile-cover-pattern" th:unless="${not #strings.isEmpty(coverImg)}" aria-hidden="true"></span>
    </div>
    <div class="profile-body">
      <div class="profile-avatar-wrap">
        <img class="profile-avatar" th:if="${not #strings.isEmpty(avatarImg)}" th:src="${avatarImg}" th:alt="${site.title}" />
        <span class="profile-avatar-fallback" th:unless="${not #strings.isEmpty(avatarImg)}" th:text="${#strings.isEmpty(site.title) ? '青' : #strings.substring(site.title, 0, 1)}">青</span>
      </div>
      <h2 class="profile-name" th:text="${theme.config.basic.profile_name ?: site.title}">熹屿 Xiyu</h2>
      <p class="profile-bio" th:text="${theme.config.basic.intro ?: site.subtitle}">个人简介</p>
      <div class="profile-actions" th:if="${theme.config.basic.show_profile_buttons != false}"
           th:with="btn1Mode=${theme.config.basic.profile_btn1_mode ?: 'login'}, btn2Icon=${#strings.isEmpty(theme.config.basic.profile_btn2_icon) ? 'rss' : theme.config.basic.profile_btn2_icon}">
        <a th:if="${btn1Mode == 'login'}" class="profile-btn primary" data-auth-profile th:href="@{${theme.config.basic.profile_btn1_url ?: '/login'}}"
           th:attr="data-auth-login-href=@{${theme.config.basic.profile_btn1_url ?: '/login'}}, data-auth-login-text=${theme.config.basic.profile_btn1_text ?: '登录'}, data-auth-user-href=@{/uc}, data-auth-user-text=${'个人中心'}"><svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg><span data-auth-label th:text="${theme.config.basic.profile_btn1_text ?: '登录'}">登录</span></a>
        <a th:unless="${btn1Mode == 'login'}" class="profile-btn primary" th:href="@{${theme.config.basic.profile_btn1_url ?: '/uc'}}"><svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg><span th:text="${theme.config.basic.profile_btn1_text ?: '登录'}">登录</span></a>
        <a class="profile-btn" th:href="@{${theme.config.basic.profile_btn2_url ?: '/rss.xml'}}"><svg class="icon" aria-hidden="true"><use th:attr="href=${'#i-' + btn2Icon}"></use></svg><span th:text="${theme.config.basic.profile_btn2_text ?: '订阅'}">订阅</span></a>
      </div>
      <div class="profile-social" th:if="${(theme.config.basic.show_github_link != false and !#strings.isEmpty(theme.config.basic.github_url)) or (theme.config.basic.show_email_link != false and !#strings.isEmpty(theme.config.basic.email))}">
        <a th:if="${theme.config.basic.show_github_link != false and !#strings.isEmpty(theme.config.basic.github_url)}" th:href="${theme.config.basic.github_url}" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg class="icon" aria-hidden="true"><use href="#i-github"></use></svg></a>
        <a th:if="${theme.config.basic.show_email_link != false and !#strings.isEmpty(theme.config.basic.email)}" th:href="|mailto:${theme.config.basic.email}|" aria-label="邮箱"><svg class="icon" aria-hidden="true"><use href="#i-mail"></use></svg></a>
      </div>
    </div>
  </section>

  <section class="widget" th:with="cats = ${categoryFinder.listAll()}">
    <h2 class="widget-title"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>文章分类</h2>
    <ul class="widget-list" th:if="${not #lists.isEmpty(cats)}">
      <li th:each="cat, state : ${cats}" th:if="${state.index < 8}">
        <a th:href="@{${cat.status.permalink}}">
          <span class="item-text" th:text="${cat.spec.displayName}">分类</span>
          <span class="count" th:text="${cat.postCount}">0</span>
        </a>
      </li>
    </ul>
    <p class="links-empty" th:unless="${not #lists.isEmpty(cats)}">暂无分类</p>
  </section>

  <section class="widget" th:with="allTags = ${tagFinder.listAll()}">
    <h2 class="widget-title"><svg class="icon" aria-hidden="true"><use href="#i-tag"></use></svg>标签云</h2>
    <div class="tag-cloud" th:if="${not #lists.isEmpty(allTags)}">
      <a class="chip" th:each="tag, state : ${allTags}" th:if="${state.index < 18}" th:href="@{${tag.status.permalink}}" th:text="${tag.spec.displayName}">标签</a>
    </div>
    <p class="links-empty" th:unless="${not #lists.isEmpty(allTags)}">暂无标签</p>
  </section>

  <section class="widget" th:with="recent = ${postFinder.list(1, 5)}">
    <h2 class="widget-title"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"></use></svg>最新文章</h2>
    <div th:each="item : ${recent.items}" class="recent-item">
      <img class="recent-thumb" th:if="${not #strings.isEmpty(item.spec.cover)}" th:src="${item.spec.cover}" th:alt="${item.spec.title}" loading="lazy" />
      <span class="recent-thumb-fallback" th:unless="${not #strings.isEmpty(item.spec.cover)}" th:text="${#strings.substring(item.spec.title, 0, 1)}">文</span>
      <div>
        <a th:href="@{${item.status.permalink}}" th:text="${item.spec.title}">文章标题</a>
        <time th:text="${#temporals.format(item.spec.publishTime, 'yyyy-MM-dd')}">2026-01-01</time>
      </div>
    </div>
  </section>

  <section class="widget" th:with="stat = ${postFinder.list(1, 1)}, catCount = ${#lists.size(categoryFinder.listAll())}, tagCount = ${#lists.size(tagFinder.listAll())}">
    <h2 class="widget-title"><svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>站点统计</h2>
    <div class="stat-grid">
      <div><strong th:text="${stat.total}">0</strong><span>文章</span></div>
      <div><strong th:text="${catCount}">0</strong><span>分类</span></div>
      <div><strong th:text="${tagCount}">0</strong><span>标签</span></div>
    </div>
  </section>
</aside>

      </div>
    </div>
  </th:block>
</html>
