<!doctype html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="|出错了 - ${site.title}|">出错了</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #f2f5ec; --surface: #ffffff; --text: #353538; --muted: #5f6a6b;
        --border: rgba(53, 53, 56, .12); --accent: #1158d1; --mint: #bbc789;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #10131a; --surface: #1a202b; --text: #f6f7f8; --muted: #aab6c4; --border: rgba(34,100,227,.24); --accent: #008fec; --mint: #4f7d88; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
        font: 16px/1.75 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      a { color: inherit; text-decoration: none; }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
      .card { width: min(100%, 620px); padding: 42px 32px; text-align: center; background: var(--surface);
        border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 12px 36px rgba(0,0,0,.08); }
      .code { margin: 0; font-size: clamp(5rem, 16vw, 8rem); font-weight: 800; line-height: 1;
        background: linear-gradient(135deg, var(--accent), var(--mint)); -webkit-background-clip: text;
        background-clip: text; color: transparent; }
      h1 { margin: 10px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 12px; color: var(--muted); }
      .detail { font-size: .85rem; opacity: .8; word-break: break-word; }
      .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border: 1px solid var(--border);
        border-radius: 999px; background: var(--bg); font-weight: 600; font-size: .94rem; }
      .btn:hover { border-color: var(--accent); color: var(--accent); }
      .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <p class="code" th:text="${error != null and error.status != null} ? ${error.status} : '404'">404</p>
        <h1 th:text="${error != null and not #strings.isEmpty(error.title)} ? ${error.title} : '这座小岛上没有你要找的页面'">这座小岛上没有你要找的页面</h1>
        <p>链接可能已经搬家，或者从未存在过。回首页看看，或者退回到刚才的位置。</p>
        <p class="detail" th:if="${error != null and not #strings.isEmpty(error.detail)}" th:text="${error.detail}"></p>
        <div class="actions">
          <a class="btn primary" th:href="@{/}">返回首页</a>
          <a class="btn" href="javascript:history.back()">返回上一页</a>
        </div>
      </div>
    </div>
  </body>
</html>
