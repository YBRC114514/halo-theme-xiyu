apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-xiyu
spec:
  displayName: 熹屿 Xiyu
  author:
    name: 拥抱日出
    website: https://blog.byside.top
  description: 一座为文字留白的岛。熹屿是一款面向 Halo 2.26+ 的响应式博客主题：杂志式首屏、克制的卡片流、清透的青蓝配色与柔和暗色模式，配合滑动高亮目录、文章入场动效、创作日历、友链自助申请与朋友圈订阅聚合，让阅读与写作都更从容。
  logo: "/themes/theme-xiyu/assets/icon-256.png"
  homepage: "https://github.com/YBRC114514/halo-theme-xiyu"
  repo: "https://github.com/YBRC114514/halo-theme-xiyu"
  issues: "https://github.com/YBRC114514/halo-theme-xiyu/issues"
  settingName: "theme-xiyu-setting"
  configMapName: "theme-xiyu-configmap"
  version: 1.0.20
  requires: ">=2.26.0"
  customTemplates:
    post:
      # Halo 自带的「默认模板」（空值）即 post.html，已是毛玻璃默认排版，
      # 故不再声明同名模板，避免下拉里出现两个「默认模板」。
      - name: 模板二
        description: Robes 风格正文排版，下划线式标题、引号引用块与 Mac 风格代码块（借鉴 robes.xin）
        screenshot: ""
        file: post_robes.html
    page:
      - name: 朋友圈
        description: 基于 Halo 官方链接插件 RSS 订阅动态（linkfeeds）的朋友圈聚合页面
        screenshot: ""
        file: friends.html
  license:
    - name: "MIT"
