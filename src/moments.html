<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
  <th:block th:fragment="head">
    <title th:text="|瞬间 - ${site.title}|">瞬间 - 熹屿 Xiyu</title>
    <include src="partials/seo.html" canonical="${site.url + '/moments'}" title="|瞬间 - ${site.title}|" description="${site.subtitle}" image="${site.logo}" type="website" />
  </th:block>

  <!-- plugin-moments list route /moments. Variables `moments` (paged) and
       `tags` are supplied by the plugin; the theme ships this template so the
       route has something to render. -->
  <th:block th:fragment="content">
    <!-- cols：后台设置的电脑端默认分栏（1 / 2 / 3）；访客在页面上切换后由脚本覆盖，
         手机端 CSS 一律压回单栏。 -->
    <div class="shell moments-page"
         th:with="activeTag=${param.tag == null or #lists.isEmpty(param.tag) ? '' : param.tag[0]},
                  cols=${theme.config.plugins != null and theme.config.plugins.moments_columns != null ? theme.config.plugins.moments_columns : '1'}"
         th:attr="data-moment-cols=${cols == '2' or cols == '3' ? cols : '1'}">
      <div class="page-head">
        <nav class="breadcrumb" aria-label="面包屑"><a th:href="@{/}">首页</a><span>/</span><span>瞬间</span></nav>
        <h1>瞬间</h1>
        <p>随手记下的图文、视频与声音。</p>
      </div>

      <div class="moment-bar">
        <div class="moment-toolbar" th:if="${tags != null and not #lists.isEmpty(tags)}">
          <a class="chip" th:classappend="${#strings.isEmpty(activeTag)} ? 'is-active' : ''" th:href="@{/moments}">全部</a>
          <a class="chip" th:each="t : ${tags}"
             th:classappend="${activeTag == t.name} ? 'is-active' : ''"
             th:href="@{/moments(tag=${t.name})}" th:text="${t.name}">标签</a>
        </div>
        <div class="view-switch moment-cols-switch" role="group" aria-label="切换分栏">
          <button type="button" data-moment-cols="1" title="单栏" aria-label="单栏"
                  th:attr="aria-pressed=${cols == '2' or cols == '3' ? 'false' : 'true'}">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2" y="2.5" width="10" height="9" rx="2" /></svg>
          </button>
          <button type="button" data-moment-cols="2" title="两栏" aria-label="两栏"
                  th:attr="aria-pressed=${cols == '2' ? 'true' : 'false'}">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="2.5" width="4.7" height="9" rx="1.6" /><rect x="7.8" y="2.5" width="4.7" height="9" rx="1.6" /></svg>
          </button>
          <button type="button" data-moment-cols="3" title="三栏" aria-label="三栏"
                  th:attr="aria-pressed=${cols == '3' ? 'true' : 'false'}">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="2.5" width="2.9" height="9" rx="1.2" /><rect x="5.55" y="2.5" width="2.9" height="9" rx="1.2" /><rect x="9.6" y="2.5" width="2.9" height="9" rx="1.2" /></svg>
          </button>
        </div>
      </div>

      <div class="moment-feed" th:if="${moments != null and not #lists.isEmpty(moments.items)}">
        <article class="moment-card" th:each="m : ${moments.items}"
                 th:with="c=${m.spec.content},
                          rt=${m.spec.releaseTime ?: ''},
                          rtDate=${#strings.length(rt) >= 10 ? #strings.substring(rt, 5, 10) : ''},
                          rtClock=${#strings.length(rt) >= 16 ? #strings.substring(rt, 11, 16) : ''},
                          single=${c.medium != null and #lists.size(c.medium) == 1},
                          ownerName=${m.owner != null and not #strings.isEmpty(m.owner.name) ? m.owner.name : ''}"
                 data-reveal>
          <div class="moment-card-head">
            <img class="moment-avatar" th:if="${m.owner != null and not #strings.isEmpty(m.owner.avatar)}" th:src="${m.owner.avatar}" th:alt="${m.owner.displayName}" loading="lazy" />
            <span class="moment-avatar mark" th:unless="${m.owner != null and not #strings.isEmpty(m.owner.avatar)}" th:text="${#strings.substring(m.owner != null ? m.owner.displayName : '博', 0, 1)}" aria-hidden="true">博</span>
            <div class="moment-meta">
              <a class="moment-owner" th:if="${not #strings.isEmpty(ownerName)}" th:href="@{|/authors/${ownerName}|}" th:text="${m.owner.displayName}">博主</a>
              <span class="moment-owner" th:unless="${not #strings.isEmpty(ownerName)}" th:text="${m.owner != null ? m.owner.displayName : '博主'}">博主</span>
              <time class="moment-time" th:attr="datetime=${rt},data-iso=${rt}" th:text="|${rtDate} ${rtClock}|">11-13 15:44</time>
            </div>
          </div>
          <div class="moment-content" th:if="${not #strings.isEmpty(c.html)}" th:utext="${c.html}"></div>
          <div class="moment-media-grid" th:if="${not #lists.isEmpty(c.medium)}" th:classappend="${single} ? 'is-single' : ''">
            <th:block th:each="media : ${c.medium}">
              <img th:if="${media.type.name == 'PHOTO'}" th:src="${media.url}" alt="瞬间图片" loading="lazy" decoding="async" data-zoom />
              <video th:if="${media.type.name == 'VIDEO'}" th:src="${media.url}" controls preload="metadata"></video>
              <audio th:if="${media.type.name == 'AUDIO'}" th:src="${media.url}" controls></audio>
            </th:block>
          </div>
          <div class="moment-foot">
            <div class="moment-tags" th:if="${not #lists.isEmpty(m.spec.tags)}">
              <a class="chip" th:each="tagName : ${m.spec.tags}" th:href="@{/moments(tag=${tagName})}" th:text="${tagName}">标签</a>
            </div>
            <a class="moment-permalink" th:href="@{|/moments/${m.metadata.name}|}">查看详情<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></a>
          </div>
        </article>
      </div>

      <div class="empty-state" th:unless="${moments != null and not #lists.isEmpty(moments.items)}">
        <svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg>
        <p>还没有发布瞬间。</p>
      </div>

      <nav class="pagination" th:if="${moments != null and (moments.hasPrevious() or moments.hasNext())}" aria-label="分页导航">
        <a th:if="${moments.hasPrevious()}" th:href="@{${moments.prevUrl}}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>上一页</a>
        <span class="page-num" th:text="|${moments.page} / ${moments.totalPages}|">1 / 1</span>
        <a th:if="${moments.hasNext()}" th:href="@{${moments.nextUrl}}">下一页<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></a>
      </nav>
    </div>
  </th:block>
</html>
