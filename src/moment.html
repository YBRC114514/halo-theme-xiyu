<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
  <th:block th:fragment="head">
    <title th:text="|瞬间 - ${site.title}|">瞬间 - 熹屿 Xiyu</title>
    <include src="partials/seo.html" canonical="${site.url + '/moments/' + moment.metadata.name}" title="|瞬间 - ${site.title}|" description="${site.subtitle}" image="${site.logo}" type="article" />
  </th:block>

  <!-- plugin-moments detail route /moments/{name}; variable `moment`. -->
  <th:block th:fragment="content">
    <div class="shell moments-page moment-detail">
      <div class="page-head">
        <nav class="breadcrumb" aria-label="面包屑"><a th:href="@{/}">首页</a><span>/</span><a th:href="@{/moments}">瞬间</a><span>/</span><span>详情</span></nav>
        <h1>瞬间</h1>
      </div>

      <article class="moment-card" data-reveal
               th:with="c=${moment.spec.content},
                        rt=${moment.spec.releaseTime ?: ''},
                        rtDate=${#strings.length(rt) >= 10 ? #strings.substring(rt, 5, 10) : ''},
                        rtClock=${#strings.length(rt) >= 16 ? #strings.substring(rt, 11, 16) : ''},
                        single=${c.medium != null and #lists.size(c.medium) == 1},
                        ownerName=${moment.owner != null and not #strings.isEmpty(moment.owner.name) ? moment.owner.name : ''}">
        <div class="moment-card-head">
          <img class="moment-avatar" th:if="${moment.owner != null and not #strings.isEmpty(moment.owner.avatar)}" th:src="${moment.owner.avatar}" th:alt="${moment.owner.displayName}" loading="lazy" />
          <span class="moment-avatar mark" th:unless="${moment.owner != null and not #strings.isEmpty(moment.owner.avatar)}" th:text="${#strings.substring(moment.owner != null ? moment.owner.displayName : '博', 0, 1)}" aria-hidden="true">博</span>
          <div class="moment-meta">
            <a class="moment-owner" th:if="${not #strings.isEmpty(ownerName)}" th:href="@{|/authors/${ownerName}|}" th:text="${moment.owner.displayName}">博主</a>
            <span class="moment-owner" th:unless="${not #strings.isEmpty(ownerName)}" th:text="${moment.owner != null ? moment.owner.displayName : '博主'}">博主</span>
            <time class="moment-time" th:attr="datetime=${rt},data-iso=${rt}" th:text="|${rtDate} ${rtClock}|">11-13 15:44</time>
          </div>
        </div>
        <div class="moment-content" th:if="${not #strings.isEmpty(c.html)}" th:utext="${c.html}"></div>
        <div class="moment-media-grid" th:if="${not #lists.isEmpty(c.medium)}" th:classappend="${single} ? 'is-single' : ''">
          <th:block th:each="media : ${c.medium}">
            <img th:if="${media.type.name == 'PHOTO'}" th:src="${media.url}" alt="瞬间图片" loading="lazy" decoding="async" data-zoom />
            <video th:if="${media.type.name == 'VIDEO'}" th:src="${media.url}" controls preload="metadata"></video>
            <audio th:if="${media.type.name == 'AUDIO'}" th:src="${media.url}" controls></audio>
          </th:block>
        </div>
        <div class="moment-foot" th:if="${not #lists.isEmpty(moment.spec.tags)}">
          <div class="moment-tags">
            <a class="chip" th:each="tagName : ${moment.spec.tags}" th:href="@{/moments(tag=${tagName})}" th:text="${tagName}">标签</a>
          </div>
        </div>
      </article>

      <div class="moment-back"><a th:href="@{/moments}">← 返回瞬间列表</a></div>
    </div>
  </th:block>
</html>
