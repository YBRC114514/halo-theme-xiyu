<nav class="pagination" th:if="${posts.hasPrevious() || posts.hasNext()}" aria-label="分页导航">
  <a th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}">
    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>上一页
  </a>
  <span class="page-num" th:text="|${posts.page} / ${posts.totalPages}|">1 / 1</span>
  <a th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}">
    下一页<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
  </a>
</nav>
