<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
  <th:block th:fragment="head">
    <title th:text="|${post.spec.title} - ${site.title}|">文章标题 - 熹屿 Xiyu</title>
    <include src="partials/seo.html" canonical="${site.url + post.status.permalink}" title="${post.spec.title}" description="${post.status.excerpt}" image="${post.spec.cover ?: site.logo}" type="article" />
    <script type="application/ld+json" th:if="${theme.config.seo.enable_structured_data != false}" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": /*[[${post.spec.title}]]*/ "",
        "description": /*[[${post.status.excerpt}]]*/ "",
        "image": /*[[${post.spec.cover ?: site.logo}]]*/ "",
        "datePublished": /*[[${#temporals.format(post.spec.publishTime,'yyyy-MM-dd')}]]*/ "",
        "dateModified": /*[[${#temporals.format(post.status.lastModifyTime ?: post.spec.publishTime,'yyyy-MM-dd')}]]*/ "",
        "author": { "@type": "Person", "name": /*[[${post.owner?.displayName ?: site.title}]]*/ "" },
        "publisher": { "@type": "Organization", "name": /*[[${site.title}]]*/ "" },
        "mainEntityOfPage": /*[[${site.url + post.status.permalink}]]*/ ""
      }
    </script>
  </th:block>

  <th:block th:fragment="content">
    <div class="shell">
      <div class="page-head">
        <nav class="breadcrumb" aria-label="面包屑">
          <a th:href="@{/}">首页</a><span>/</span>
          <th:block th:if="${not #lists.isEmpty(post.categories)}">
            <a th:href="@{${post.categories[0].status.permalink}}" th:text="${post.categories[0].spec.displayName}">分类</a><span>/</span>
          </th:block>
          <span>正文</span>
        </nav>
      </div>

      <div class="content-grid no-sidebar">
        <div>
          <div class="article-layout" th:classappend="${theme.config.features.show_toc == false} ? 'no-toc' : ''">
            <article class="article" data-article-enter>
              <header class="article-head">
                <h1 th:text="${post.spec.title}">文章标题</h1>
                <div class="article-meta">
                  <span><svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg><time th:datetime="${post.spec.publishTime}" th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}">2026-01-01</time></span>
                  <span th:if="${not #lists.isEmpty(post.categories)}"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg><a th:each="cat : ${post.categories}" th:href="@{${cat.status.permalink}}" th:text="${cat.spec.displayName}">分类</a></span>
                  <span><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg><span th:text="${post.stats.visit}">0</span> 次阅读</span>
                  <span><svg class="icon" aria-hidden="true"><use href="#i-message"></use></svg><span th:text="${post.stats.comment}">0</span> 条评论</span>
                  <span th:if="${post.owner != null}"><svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg><a th:href="@{${post.owner.permalink}}" th:text="${post.owner.displayName}">作者</a></span>
                </div>
              </header>

              <figure class="article-cover" th:if="${not #strings.isEmpty(post.spec.cover)}">
                <img th:src="${post.spec.cover}" th:alt="${post.spec.title}" loading="lazy" />
              </figure>

              <div class="summary-card" th:if="${theme.config.features.show_summary_card != false and not #strings.isEmpty(post.status.excerpt)}"
                   th:attr="data-typing=${theme.config.features.summary_typing != false ? 'on' : 'off'},
                            data-typing-speed=${theme.config.features.summary_typing_speed ?: '16'}">
                <div class="summary-head"><span><svg class="icon" aria-hidden="true"><use href="#i-sparkles"></use></svg>文章摘要</span></div>
                <p class="summary-text" th:text="${post.status.excerpt}">这篇文章的摘要内容。</p>
              </div>

              <div class="entry-content" th:utext="${post.content.content}">
                <p>正文内容</p>
              </div>

              <footer class="article-footer">
                <div class="article-tags" th:if="${not #lists.isEmpty(post.tags)}">
                  <a class="chip" th:each="tag : ${post.tags}" th:href="@{${tag.status.permalink}}" th:text="|# ${tag.spec.displayName}|"># 标签</a>
                </div>
                <div class="post-meta"><span>最后更新于 <time th:text="${#temporals.format(post.status.lastModifyTime ?: post.spec.publishTime, 'yyyy-MM-dd')}">2026-01-01</time></span></div>
              </footer>
            </article>

            <aside class="toc" th:if="${theme.config.features.show_toc != false}" aria-label="文章目录">
              <div class="toc-title"><svg class="icon" aria-hidden="true"><use href="#i-list-alt"></use></svg>本页目录</div>
              <nav><ul data-toc-list><li class="toc-indicator" aria-hidden="true"></li></ul></nav>
            </aside>
          </div>

          <nav class="post-nav" th:with="cursor = ${postFinder.cursor(post.metadata.name)}" aria-label="上下篇文章">
            <a th:if="${cursor.hasPrevious()}" th:href="@{${cursor.previous.status.permalink}}"><small>← 上一篇</small><strong th:text="${cursor.previous.spec.title}">上一篇</strong></a>
            <span th:unless="${cursor.hasPrevious()}"></span>
            <a class="next" th:if="${cursor.hasNext()}" th:href="@{${cursor.next.status.permalink}}"><small>下一篇 →</small><strong th:text="${cursor.next.spec.title}">下一篇</strong></a>
            <span th:unless="${cursor.hasNext()}"></span>
          </nav>

          <section class="comments" id="post-comment" th:if="${haloCommentEnabled}">
            <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
          </section>
        </div>
      </div>
    </div>
  </th:block>
</html>
